---
- name: Install Python packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true

- name: Create application directory
  ansible.builtin.file:
    path: /opt/fastapi_app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: requirements.txt
    dest: /opt/fastapi_app/requirements.txt
    owner: root
    group: root
    mode: "0644"

- name: Copy main.py
  ansible.builtin.copy:
    src: main.py
    dest: /opt/fastapi_app/main.py
    owner: root
    group: root
    mode: "0644"
  notify: restart fastapi

- name: Create virtualenv and install dependencies
  ansible.builtin.pip:
    requirements: /opt/fastapi_app/requirements.txt
    virtualenv: /opt/fastapi_app/venv
    virtualenv_command: python3 -m venv

- name: Deploy systemd unit file
  ansible.builtin.template:
    src: fastapi.service.j2
    dest: /etc/systemd/system/fastapi.service
    owner: root
    group: root
    mode: "0644"
  notify: restart fastapi

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: fastapi
    state: started
    enabled: true
    daemon_reload: true
