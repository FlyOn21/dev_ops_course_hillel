---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy FastAPI reverse proxy config
  ansible.builtin.template:
    src: nginx_fastapi.conf.j2
    dest: /etc/nginx/sites-available/fastapi.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable FastAPI site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/fastapi.conf
    dest: /etc/nginx/sites-enabled/fastapi.conf
    state: link
  notify: reload nginx

- name: Remove old fastapi site config (without .conf)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/fastapi
    state: absent
  notify: reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx
